
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>
<body>

    <center>
        <h1>Movie Ticket Booking</h1>
        <hr>

        <h2>Login Page</h2>

        <form action="home.html" method="get">

            <table cellpadding="10">
                <tr>
                    <td>Email:</td>
                    <td>
                        <input type="email"
                               placeholder="Enter Email"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td>
                        <input type="password"
                               placeholder="Enter Password"
                               required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit"
                               value="Login">

                        <input type="reset"
                               value="Clear">
                    </td>
                </tr>
            </table>

        </form>

        <p>
            <a href="forgot.html">
                Forgot Password?
            </a>
        </p>

        <p>
            Don't have an account?
            <a href="signup.html">Signup</a>
        </p>

        <p>
            <a href="home.html">Back to Home</a>
        </p>

    </center>

</body>
</html>
